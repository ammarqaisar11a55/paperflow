[package]
name = "paperflow"
version = "0.2.0"
description = "Offline PDF toolkit. Your PDFs. Your Device. Your Privacy."
authors = ["Muhammad Ammar Qaisar"]
license = "MIT"
repository = "https://github.com/ammarqaisar11a55/paperflow"
edition = "2021"
rust-version = "1.80"

[lib]
name = "paperflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.47"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
flate2 = "1"
log = "0.4"
libc = "0.2"
quick-xml = "0.38"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
