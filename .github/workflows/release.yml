name: Release

# A version tag creates a draft GitHub release with the packages and their
# checksums. Nothing becomes public until the draft is published by hand, and
# the Snap Store upload is a separate, manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches every version file
        run: |
          for version in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"; do
            test "v$version" = "$GITHUB_REF_NAME" || {
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version"
              exit 1
            }
          done

  packages:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system packages and processing engines
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libssl-dev libxdo-dev patchelf file \
            ghostscript poppler-utils qpdf tesseract-ocr tesseract-ocr-eng
      - run: npm ci
      - run: npm test
      - run: npm run tauri build -- --bundles deb
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: src-tauri/target/release/bundle/deb/*.deb

  snap:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: snapcraft
        uses: snapcore/action-build@v1
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}

  draft:
    needs: [packages, snap]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.deb *.snap > SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "PaperFlow ${GITHUB_REF_NAME#v}" --generate-notes \
            *.deb *.snap SHA256SUMS
