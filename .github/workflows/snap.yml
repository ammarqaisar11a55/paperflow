name: Snap

# Builds the snap whenever its packaging or build inputs change, so a broken
# snap is caught on main rather than during a release. Nothing here publishes.
on:
  push:
    branches: [main]
    paths:
      - "snap/**"
      - "packaging/**"
      - "scripts/relink-libreoffice.sh"
      - "scripts/snap-smoke-test.sh"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/snap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: snapcraft
        uses: snapcore/action-build@v1
      - name: Install the snap and check the bundled engines
        run: |
          sudo snap install --dangerous ${{ steps.snapcraft.outputs.snap }}
          for bin in gs qpdf pdftoppm pdftotext pdfimages pdftohtml tesseract; do
            test -x "/snap/paperflow/current/usr/bin/$bin" || { echo "::error::$bin missing"; exit 1; }
          done
          test -x /snap/paperflow/current/usr/lib/libreoffice/program/soffice
          grep -q 'BRAND_BASE_DIR=${ORIGIN}/..' /snap/paperflow/current/usr/lib/libreoffice/program/fundamentalrc
          if grep -q 'file:///etc/libreoffice' /snap/paperflow/current/usr/lib/libreoffice/program/fundamentalrc; then
            echo "::error::LibreOffice still reads its configuration from /etc"; exit 1
          fi
          test -e /snap/paperflow/current/usr/lib/libreoffice/share/registry/main.xcd
          ls /snap/paperflow/current/usr/share/tesseract-ocr/5/tessdata/eng.traineddata
          snap connections paperflow
      - name: Convert documents with the installed snap
        run: snap run --shell paperflow -c "bash $GITHUB_WORKSPACE/scripts/snap-smoke-test.sh"
      - name: Keep the snap for a week
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}
          retention-days: 7
