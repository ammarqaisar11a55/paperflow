name: Snap

# Builds the snap whenever its packaging or build inputs change, so a broken
# snap is caught on main rather than during a release. Nothing here publishes.
on:
  push:
    branches: [main]
    paths:
      - "snap/**"
      - "packaging/**"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/snap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: snapcraft
        uses: snapcore/action-build@v1
      - name: Install the snap and check the bundled engines
        run: |
          sudo snap install --dangerous ${{ steps.snapcraft.outputs.snap }}
          for bin in gs qpdf pdftoppm pdftotext pdfimages tesseract; do
            test -x "/snap/paperflow/current/usr/bin/$bin" || { echo "::error::$bin missing"; exit 1; }
          done
          ls /snap/paperflow/current/usr/share/tesseract-ocr/5/tessdata/eng.traineddata
          snap connections paperflow
      - name: Keep the snap for a week
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}
          retention-days: 7
